name: Dev build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Add Android
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android
          echo "=== ROOT ==="
          ls -la
          echo "=== ANDROID ==="
          ls -la android || true
          echo "=== ANDROID FILES ==="
          find android -maxdepth 3 -type f | head -80 || true

      - name: Patch Android project
        run: node scripts/patch-android.js

      - name: Build APK
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          elif [ -f "../gradlew" ]; then
            chmod +x ../gradlew
            ../gradlew -p . assembleRelease
          else
            echo "gradlew not found"
            echo "=== android content ==="
            ls -la
            echo "=== root content ==="
            ls -la ..
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlterEditingMobile-APK
          path: android/app/build/outputs/apk/release/*.apk
