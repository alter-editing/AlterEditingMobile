name: Build Android APK

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version for APK/release, for example 1.0.1'
        required: false
        default: ''
      publish_release:
        description: 'Publish GitHub Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      UPDATE_REPO: ${{ github.repository }}
      IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Resolved version: ${VERSION} (${VERSION_CODE})"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Install deps
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile --prefer-offline
          pnpm exec vite --version
          pnpm exec cap --version

      - name: Build web
        shell: bash
        run: |
          node scripts/write-version.js
          pnpm exec vite build

      - name: Recreate Android
        shell: bash
        run: |
          rm -rf android
          pnpm exec cap add android
          pnpm exec cap sync android
          echo "=== ROOT ==="
          ls -la
          echo "=== ANDROID ==="
          ls -la android || true
          echo "=== ANDROID FILES ==="
          find android -maxdepth 3 -type f | head -120 || true
          if [[ ! -f "android/gradlew" ]]; then
            echo "ERROR: android/gradlew was not generated by Capacitor."
            echo "Check @capacitor/android dependency in package.json."
            exit 1
          fi

      - name: Decode Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          RELEASE_REQUESTED=false
          if [[ "${IS_TAG_RELEASE}" == "true" || "${MANUAL_RELEASE}" == "true" ]]; then
            RELEASE_REQUESTED=true
          fi

          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            if [[ "${RELEASE_REQUESTED}" == "true" ]]; then
              echo "Missing Android signing secrets. Release builds require signing."
              echo "Add repository secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
              exit 1
            fi
            echo "No Android signing secrets found. Building unsigned/debug APK artifact."
            echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release.keystore
          echo "ANDROID_KEYSTORE_PATH=${GITHUB_WORKSPACE}/android/app/release.keystore" >> "$GITHUB_ENV"

          echo "Available aliases in release keystore:"
          keytool -list -v -keystore android/app/release.keystore -storepass "${ANDROID_KEYSTORE_PASSWORD}" | grep -E "Alias name:" || true

          if keytool -list -keystore android/app/release.keystore -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" >/dev/null 2>&1; then
            RESOLVED_ALIAS="${ANDROID_KEY_ALIAS}"
            echo "Using requested Android key alias: ${RESOLVED_ALIAS}"
          else
            RESOLVED_ALIAS="$(keytool -list -v -keystore android/app/release.keystore -storepass "${ANDROID_KEYSTORE_PASSWORD}" | sed -n 's/^Alias name: //p' | head -n 1)"
            if [[ -z "${RESOLVED_ALIAS}" ]]; then
              echo "Could not detect any key alias inside release.keystore."
              exit 1
            fi
            echo "Requested alias '${ANDROID_KEY_ALIAS}' was not found. Using detected alias: ${RESOLVED_ALIAS}"
          fi
          echo "ANDROID_KEY_ALIAS=${RESOLVED_ALIAS}" >> "$GITHUB_ENV"
          echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"

      - name: Patch Android project
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/patch-android.js
          echo "=== FFmpegKit AAR check ==="
          ls -lh libs/ffmpeg-kit-full-gpl.aar android/app/libs/ffmpeg-kit-full.aar
          test -s libs/ffmpeg-kit-full-gpl.aar
          test -s android/app/libs/ffmpeg-kit-full.aar
          AAR_SIZE=$(stat -c%s android/app/libs/ffmpeg-kit-full.aar)
          if [ "$AAR_SIZE" -lt 60000000 ]; then
            echo "ERROR: ffmpeg-kit FULL-GPL AAR is too small or missing from android/app/libs."
            exit 1
          fi

      - name: Build APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "=== BEFORE BUILD: root ==="
          ls -la
          echo "=== BEFORE BUILD: android ==="
          ls -la android || true
          cd android
          if [[ ! -f "./gradlew" ]]; then
            echo "ERROR: gradlew not found in android/"
            echo "=== android content ==="
            ls -la
            echo "=== root content ==="
            ls -la ..
            exit 1
          fi
          chmod +x ./gradlew
          if [[ "${SIGNED_BUILD}" == "true" ]]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Prepare artifacts
        id: artifacts
        shell: bash
        run: |
          mkdir -p release-out
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${SIGNED_BUILD}" == "true" ]]; then
            APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          else
            APK_PATH="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          fi
          if [[ -z "${APK_PATH}" ]]; then
            echo "APK not found"
            exit 1
          fi
          OUT_APK="release-out/AlterEditingMethod-Mobile-${VERSION}.apk"
          cp "${APK_PATH}" "${OUT_APK}"
          cat > release-out/latest-android.json <<JSON
          {
            "version": "${VERSION}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "apk": "AlterEditingMethod-Mobile-${VERSION}.apk",
            "repo": "${GITHUB_REPOSITORY}"
          }
          JSON
          echo "apk=${OUT_APK}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlterEditing-Android-${{ steps.version.outputs.version }}
          path: release-out/*

      - name: Publish GitHub Release
        if: ${{ env.IS_TAG_RELEASE == 'true' || env.MANUAL_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: |
            release-out/AlterEditingMethod-Mobile-${{ steps.version.outputs.version }}.apk
            release-out/latest-android.json
          generate_release_notes: true
